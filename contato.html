<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitofarma Amazônia - Contato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-emerald-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-4 md:mb-0">
                <i class="fa-solid fa-leaf text-3xl text-emerald-300"></i>
                <span class="text-2xl font-bold tracking-wide">Fitofarma Amazônia</span>
            </div>
            <nav class="flex space-x-6 font-medium">
                <a href="index.html" class="hover:text-emerald-300 transition">Início</a>
                <a href="catalogo.html" class="hover:text-emerald-300 transition">Catálogo & App</a>
                <a href="relatorio.html" class="hover:text-emerald-300 transition">Relatório do Projeto</a>
                <a href="contato.html" class="text-emerald-300 border-b-2 border-emerald-300 pb-1">Contato</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full">
        <div class="bg-white rounded-2xl shadow-xl p-8 md:p-12 border border-emerald-100">
            <h1 class="text-3xl font-extrabold text-emerald-900 mb-6 flex items-center gap-3">
                <i class="fa-solid fa-envelope text-emerald-600"></i> Fale Conosco
            </h1>
            <p class="text-gray-600 mb-8">
                Tem dúvidas, sugestões ou deseja colaborar com o projeto Fitofarma Amazônia? Entre em contato conosco preenchendo o formulário abaixo.
            </p>

            <form onsubmit="alert('Mensagem enviada com sucesso!'); event.preventDefault(); this.reset();" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Seu Nome:</label>
                    <input type="text" required class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Seu E-mail:</label>
                    <input type="email" required class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mensagem:</label>
                    <textarea rows="4" required class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl shadow transition">
                    Enviar Mensagem
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-emerald-950 text-emerald-400 py-6 text-center text-sm mt-auto">
        <p>&copy; 2026 Fitofarma Amazônia. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
